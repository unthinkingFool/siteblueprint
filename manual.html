<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteBlueprint Manual</title>
<style>
  :root { --ink:#0b1d33; --ink2:#12304f; --line:#2f5f8e; --paper:#e8f1f8; --mute:#9bbad4; --signal:#ffd23f; color-scheme: dark; }
  body { margin:0; background:var(--ink); color:var(--paper); font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;
    background-image:linear-gradient(var(--ink2) 1px,transparent 1px),linear-gradient(90deg,var(--ink2) 1px,transparent 1px); background-size:28px 28px; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; background: var(--ink); min-height: 100vh; border-left:1px solid var(--line); border-right:1px solid var(--line); }
  h1 { font: 600 34px/1.2 Georgia,"Times New Roman",serif; margin: 0 0 8px; }
  h2 { font: 600 22px/1.3 Georgia,serif; margin: 36px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
  a { color: var(--signal); }
  code { background: var(--ink2); padding: 1px 6px; border-radius: 3px; font: 14px ui-monospace,Menlo,Consolas,monospace; }
  table { width:100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--ink2); }
  li { margin: 6px 0; }
  hr { border: 0; border-top: 1px solid var(--line); }
</style>
</head>
<body><main id="doc">Loading manual…</main><script src="manual.js"></script></body>
</html>
